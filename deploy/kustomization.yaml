# Deployed by Argo CD (ApplicationSets in kiukairor-org/homelab-gitops), which sets:
#   namespace (app-<repo> / pr-<repo>-<n>), image tag (= git commit SHA built by ci.yml),
#   APP_NAME, and the tailnet hostname of the Ingress. Keep resource names as-is.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - pvc.yaml
# D81: New Relic Browser (RUM) copy/paste snippet for NR app "houss" (account 8680047). Not a secret: the browser
# key ships in every page. Regenerate from NerdGraph (BrowserApplicationEntity loader script) if the app is recreated.
configMapGenerator:
  - name: newrelic-browser
    files: [snippet.html=newrelic-browser-snippet.html]
labels:
  - pairs: {app.kubernetes.io/name: app}
    includeSelectors: true
