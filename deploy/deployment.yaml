apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  replicas: 1
  strategy: {type: Recreate}                         # RWO volume
  revisionHistoryLimit: 2
  selector: {}
  template:
    spec:
      securityContext: {runAsNonRoot: true, fsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      automountServiceAccountToken: false
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: app-data}
      containers:
        - name: app
          image: ghcr.io/kiukairor-org/app-template:latest   # overridden by Argo CD
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: APP_NAME, value: app}                   # overridden by Argo CD
            # Traces go to the in-cluster OpenTelemetry Collector (homelab-gitops apps/observability), no key here.
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.observability.svc.cluster.local:4318"}
            - {name: DATA_DIR, value: /data}
            # Secret "houss-secrets" (key: password) is created out of band; it is not stored in this repo.
            - name: HOUSS_PASSWORD
              valueFrom: {secretKeyRef: {name: houss-secrets, key: password}}
          volumeMounts: [{name: data, mountPath: /data}]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 30}
