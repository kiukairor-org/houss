<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>houss</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2e7d32">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="houss">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/192.png">
<link rel="apple-touch-icon" href="/icons/180.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<section id="login" hidden>
  <h1>houss</h1>
  <form id="login-form">
    <input id="password" type="password" placeholder="Household password" autocomplete="current-password" required>
    <button>Sign in</button>
    <p id="login-error" role="alert"></p>
  </form>
</section>
<main id="app" hidden>
  <header><h1>houss</h1><span id="status"></span><button id="logout" type="button">Sign out</button></header>
  <nav id="tabs">
    <button data-tab="all" class="active">All</button>
    <button data-tab="shopping">Shopping</button>
    <button data-tab="todos">Todos</button>
    <button data-tab="midterm">Mid-term</button>
  </nav>
  <div id="tags" hidden></div>
  <form id="add-form">
    <input id="title" placeholder="Add item" maxlength="200" required>
    <select id="add-tab" aria-label="Tab">
      <option value="shopping">Shopping</option>
      <option value="todos">Todos</option>
      <option value="midterm">Mid-term</option>
    </select>
    <input id="date" type="date" aria-label="Target date">
    <button>Add</button>
  </form>
  <ul id="list"></ul>
</main>
<script src="/app.js"></script>
</body>
</html>
