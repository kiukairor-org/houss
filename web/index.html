<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>houss</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#3cc79a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="houss">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/192.png">
<link rel="apple-touch-icon" href="/icons/180.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<section id="login" hidden>
  <h1>houss</h1>
  <form id="login-form">
    <input id="password" type="password" placeholder="Household password" autocomplete="current-password" required>
    <button>Sign in</button>
    <p id="login-error" role="alert"></p>
  </form>
</section>
<main id="app" hidden>
  <header><h1>houss</h1><span id="status" role="status"></span><button id="chat-open" type="button" aria-label="Assistant">💬</button><button id="logout" type="button">Sign out</button></header>
  <nav id="tabs" aria-label="Filter">
    <button data-tab="shopping" class="active">Shopping <span class="count"></span></button>
    <button data-tab="todos">Todos <span class="count"></span></button>
    <button data-tab="midterm">Mid-term <span class="count"></span></button>
    <button data-tab="all">All <span class="count"></span></button>
  </nav>
  <div id="tags" hidden></div>
  <form id="add-form">
    <input id="title" placeholder="Add item" aria-label="New item" maxlength="200" required>
    <button class="primary">Add</button>
    <label>Due
      <input id="date" type="date">
    </label>
  </form>
  <p id="toast" role="status" hidden></p>
  <section id="suggest" aria-label="Running low?" hidden>
    <h2>Running low?</h2>
    <ul id="suggest-list"></ul>
  </section>
  <p id="total" hidden></p>
  <ul id="list"></ul>
  <section id="chat" aria-label="Assistant">
    <header><button id="chat-back" type="button" class="ghost">← Lists</button><h2>Assistant</h2><button id="chat-new" type="button" class="ghost">New chat</button></header>
    <p id="chat-status" role="status"></p>
    <details id="profile">
      <summary>What houss knows about you</summary>
      <p id="profile-meta"></p>
      <textarea id="profile-text" rows="8" aria-label="What houss knows about you"></textarea>
      <div class="row">
        <button id="profile-save" type="button" class="primary">Save</button>
        <button id="profile-refresh" type="button" class="ghost">Re-learn now</button>
        <button id="profile-clear" type="button" class="ghost">Clear</button>
      </div>
    </details>
    <div id="chat-log" aria-live="polite"></div>
    <form id="chat-form">
      <input id="chat-input" placeholder="Ask about your lists…" aria-label="Message" maxlength="1000" autocomplete="off" required>
      <button class="primary">Send</button>
    </form>
  </section>
  <div id="empty" hidden>
    <svg viewBox="0 0 24 24" width="48" height="48" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/></svg>
    <p>Nothing here yet.<br>Add your first item above.</p>
  </div>
</main>
<script src="/app.js"></script>
</body>
</html>
